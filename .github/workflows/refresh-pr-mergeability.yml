name: refresh-pr-mergeability
on:
  push:
    paths:
      - ".github/workflows/refresh-pr-mergeability.yml"
permissions:
  contents: read
  pull-requests: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Reopen PR #2 to force mergeability recompute
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          reopen() { gh pr reopen 2 --repo usxs/simple-blog || true; }
          trap reopen EXIT
          gh pr close 2 --repo usxs/simple-blog || true
          sleep 5
