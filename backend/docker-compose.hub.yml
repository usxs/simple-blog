# 博客后端（V2：SQLite 存储）—— 直接用 Docker Hub 镜像启动，不需要源码或 Dockerfile
#
#   mkdir -p data img file
#   docker compose -f docker-compose.hub.yml up -d
#
# 默认镜像标签是 v2；要固定某次构建，在 .env 里写短 SHA 或版本标签（如 IMAGE_TAG=2.0.0）。
# 数据落在当前目录的 data/（含 blog.db）、img/、file/，升级镜像不丢数据。
# 完整说明：https://usxs.github.io/simple-blog/ref/docker/
services:
  backend:
    image: ${IMAGE_NAME:-starspacec/simple-blog-backend}:${IMAGE_TAG:-v2}
    container_name: simple-blog-backend
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "127.0.0.1:${HOST_PORT:-33001}:33001"
    environment:
      TZ: Asia/Shanghai
      NODE_ENV: production
      PORT: "33001"
      STORE: ${STORE:-sqlite}
      DB_FILE: ${DB_FILE:-/app/data/blog.db}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SITE_PUBLIC_URL: ${SITE_PUBLIC_URL:-https://www.example.com}
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-https://api.example.com}
      CAPTCHA_SECRET: ${CAPTCHA_SECRET:-}
      INDEXNOW_KEY: ${INDEXNOW_KEY:-}
      INDEXNOW_KEY_LOCATION: ${INDEXNOW_KEY_LOCATION:-}
      PROBE_ENABLED: ${PROBE_ENABLED:-1}
      PROBE_PROVIDER: ${PROBE_PROVIDER:-cf}
      PROBE_URL: ${PROBE_URL:-}
      PROBE_PANEL_URL: ${PROBE_PANEL_URL:-}
      SITE_NAME: ${SITE_NAME:-简单博客}
      SITE_AVATAR: ${SITE_AVATAR:-简}
      SITE_TITLE: ${SITE_TITLE:-简单博客}
      SITE_SUBTITLE: ${SITE_SUBTITLE:-这里是我的个人博客，记录技术、折腾与生活。}
      SITE_GITHUB: ${SITE_GITHUB:-}
      SITE_X: ${SITE_X:-}
      SITE_TELEGRAM: ${SITE_TELEGRAM:-}
      SITE_EMAIL: ${SITE_EMAIL:-}
      SITE_ICP: ${SITE_ICP:-}
      SITE_POLICE: ${SITE_POLICE:-}
      SITE_MOE: ${SITE_MOE:-}
      SITE_COPYRIGHT: ${SITE_COPYRIGHT:-1}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-}
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:-}
    volumes:
      - ./img:/app/img
      - ./file:/app/file
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:33001/api/auth/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
