<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-theme-mode="auto">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>404 · 简单博客</title>
  <meta name="robots" content="noindex" />
  <meta name="description" content="页面走丢了。这条链接指向的内容不存在，或者已经被作者隐藏。" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=5" id="status-favicon">
  <link rel="stylesheet" href="/status.css?v=20261125-2" />
</head>
<body data-status-code="404">
  <main class="status-shell status-screen">
    <div class="status-brand">
      <span class="status-logo" data-site-avatar>S</span>
      <span data-site-name>简单博客</span>
    </div>
    <section class="status-card" role="alert">
      <p class="status-kicker">ERROR 404</p>
      <h1 class="status-title">页面走丢了</h1>
      <p class="status-desc">这条链接指向的内容不存在，或者已经被作者隐藏。</p>
      <div class="status-actions">
        <a class="status-btn status-btn--primary" href="/">回到首页</a>
        <button class="status-btn" type="button" onclick="if (history.length > 1) history.back(); else location.href='/'; return false;">返回上一页</button>
      </div>
      <p class="status-note">它可能已经被移动、删除，或者从来就没有存在过。</p>
    </section>
    <footer class="status-footer">
      <span data-site-copyright>© 2026 简单博客</span>
      <a href="/">example.com</a>
    </footer>
  </main>
  <script src="/status.js?v=20261125-2"></script>
</body>
</html>
